name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./app

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
